name: Relancer le certificat HTTPS GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-pages-certificate.yml"
      - "data/repair-pages-certificate-trigger.txt"

permissions:
  contents: read
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Réappliquer le domaine personnalisé sans modifier le DNS
        id: reapply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          status=$(curl -sS -L \
            -o /tmp/pages-update.json \
            -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"cname":"parisauriol.com","source":{"branch":"main","path":"/"}}')
          echo "HTTP_STATUS=${status}"
          test -s /tmp/pages-update.json && cat /tmp/pages-update.json || true
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Contrôler l’émission du certificat
        id: certificate
        shell: bash
        run: |
          set +e
          valid=false
          for attempt in $(seq 1 12); do
            echo "Contrôle certificat ${attempt}/12"
            certificate=$(timeout 15 bash -c \
              'echo | openssl s_client -connect parisauriol.com:443 -servername parisauriol.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName' \
              2>/dev/null)
            echo "$certificate"
            if echo "$certificate" | grep -Eq 'DNS:parisauriol\.com([,[:space:]]|$)'; then
              valid=true
              break
            fi
            sleep 10
          done
          echo "valid=${valid}" >> "$GITHUB_OUTPUT"

      - name: Activer l’obligation HTTPS lorsque le certificat est prêt
        if: steps.certificate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          status=$(curl -sS -L \
            -o /tmp/pages-https.json \
            -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"https_enforced":true}')
          echo "HTTP_STATUS=${status}"
          test -s /tmp/pages-https.json && cat /tmp/pages-https.json || true

      - name: Résultat
        shell: bash
        run: |
          echo "Réapplication Pages : HTTP ${{ steps.reapply.outputs.status }}"
          echo "Certificat parisauriol.com valide : ${{ steps.certificate.outputs.valid }}"
