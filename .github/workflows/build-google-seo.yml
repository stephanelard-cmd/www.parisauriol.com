name: Construire le référencement Google multilingue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_seo_site.py"
      - "assets/app.js"
      - "assets/seo.css"
      - "assets/translations.json"
      - "assets/photos/manifest.json"
      - ".github/workflows/build-google-seo.yml"
      - "data/google-seo-trigger.txt"

permissions:
  contents: write

concurrency:
  group: parisauriol-google-seo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le parseur HTML
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Finaliser le générateur SEO
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_seo_site.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          # Traduire l’enveloppe de la FAQ avant de remplacer son contenu principal.
          translate_line = '    translate_soup(soup, language, catalogue, missing)'
          faq_line = '    if page == "faq.html":'
          if faq_line in lines:
              faq_index = lines.index(faq_line)
              if faq_index == 0 or lines[faq_index - 1] != translate_line:
                  else_index = lines.index('    else:', faq_index)
                  old_translate_index = lines.index('        translate_soup(soup, language, catalogue, missing)', else_index)
                  replacement = [
                      translate_line,
                      faq_line,
                      '        faq_fragment = build_faq_main(language)',
                      '        if soup.main:',
                      '            soup.main.replace_with(faq_fragment.main)',
                      '        else:',
                      '            soup.body.append(faq_fragment.main)',
                  ]
                  lines[faq_index:old_translate_index + 1] = replacement

          # Créer une balise og:locale:alternate distincte par langue.
          faulty_locale = '            set_meta(soup, "property", "og:locale:alternate", language_config["locale"])'
          if faulty_locale in lines:
              index = lines.index(faulty_locale)
              lines[index:index + 1] = [
                  '            alternate_locale = soup.new_tag("meta")',
                  '            alternate_locale["property"] = "og:locale:alternate"',
                  '            alternate_locale["content"] = language_config["locale"]',
                  '            soup.head.append(alternate_locale)',
              ]

          # Ne jamais réécrire les URL absolues canonical et hreflang.
          rewrite_loop = '    for link in soup.find_all(href=True):'
          relations_line = '        relations = set(link.get("rel", []))'
          if rewrite_loop in lines:
              index = lines.index(rewrite_loop)
              if index + 1 >= len(lines) or lines[index + 1] != relations_line:
                  lines[index + 1:index + 1] = [
                      relations_line,
                      '        if link.name == "link" and relations.intersection({"canonical", "alternate"}):',
                      '            continue',
                  ]

          # Inscrire les liens de réservation dans le HTML servi aux robots, sans dépendre de JavaScript.
          html_language_line = '    soup.html["lang"] = language'
          airbnb_loop = '    for link in soup.select("[data-airbnb]"):'
          if html_language_line in lines:
              index = lines.index(html_language_line)
              if airbnb_loop not in lines[index:index + 10]:
                  lines[index + 1:index + 1] = [
                      airbnb_loop,
                      '        link["href"] = "https://www.airbnb.fr/rooms/926532409861049580"',
                      '    for link in soup.select("[data-booking]"):',
                      '        link["href"] = "https://www.booking.com/hotel/fr/paris-auriol.fr.html"',
                  ]

          text = '\n'.join(lines) + '\n'
          text = text.replace('"latitude": 48.83720,', '"latitude": "48.83720",')
          text = text.replace('"longitude": 2.37220,', '"longitude": "2.37220",')
          text = text.replace(
              'Disallow: /data/\nDisallow: /README.md',
              'Disallow: /data/seo-translation-report.json\n'
              'Disallow: /data/seo-manifest.json\n'
              'Disallow: /data/manual-sync-trigger.txt\n'
              'Disallow: /data/google-seo-trigger.txt\n'
              'Disallow: /README.md',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Générer les pages françaises, anglaises, allemandes et espagnoles
        run: python scripts/build_seo_site.py

      - name: Contrôler la qualité technique
        run: |
          python -m py_compile scripts/build_seo_site.py scripts/sync_calendars.py
          node --check assets/app.js
          python -m json.tool data/seo-manifest.json
          python -m json.tool data/seo-translation-report.json >/dev/null
          grep -q 'VacationRental' index.html
          grep -q 'containsPlace' index.html
          grep -q 'identifier' index.html
          grep -q 'hreflang="en"' index.html
          grep -q 'hreflang="de"' index.html
          grep -q 'hreflang="es"' index.html
          grep -q 'xmlns:xhtml' sitemap.xml
          grep -q 'xmlns:image' sitemap.xml
          test -f faq.html
          test -f en/index.html
          test -f de/index.html
          test -f es/index.html
          test -f en/faq.html
          test -f de/faq.html
          test -f es/faq.html
          ! grep -R --line-number '?lang=' ./*.html en de es
          ! grep -R --line-number 'images.unsplash.com' ./*.html en de es

      - name: Enregistrer la nouvelle architecture SEO
        run: |
          git add \
            '*.html' \
            en de es \
            sitemap.xml robots.txt \
            data/seo-manifest.json data/seo-translation-report.json \
            scripts/build_seo_site.py
          if git diff --cached --quiet; then
            echo "Le référencement est déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimiser le référencement Google et publier les langues"
          git pull --rebase origin main
          git push origin HEAD:main
