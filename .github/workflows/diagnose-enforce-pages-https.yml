name: Diagnostiquer et activer HTTPS GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-enforce-pages-https.yml"

permissions:
  contents: read
  pages: write

jobs:
  https:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la configuration GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" > pages-before.json
          python - <<'PY'
          import json
          data = json.load(open('pages-before.json', encoding='utf-8'))
          print(json.dumps({
              'url': data.get('html_url'),
              'custom_domain': data.get('cname'),
              'https_enforced': data.get('https_enforced'),
              'certificate_state': (data.get('https_certificate') or {}).get('state'),
              'certificate_description': (data.get('https_certificate') or {}).get('description'),
              'certificate_domains': (data.get('https_certificate') or {}).get('domains'),
              'protected_domain_state': data.get('protected_domain_state'),
              'pending_domain_unverified_at': data.get('pending_domain_unverified_at'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Contrôler DNS et certificat présenté
        run: |
          set -euo pipefail
          for query in \
            'parisauriol.com A' \
            'parisauriol.com AAAA' \
            'parisauriol.com CAA' \
            'www.parisauriol.com CNAME' \
            'www.parisauriol.com A'; do
            set -- $query
            name=$1
            type=$2
            echo "===== DNS $name $type ====="
            curl -fsS "https://dns.google/resolve?name=${name}&type=${type}" | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"Status": d.get("Status"), "Answer": d.get("Answer", [])}, ensure_ascii=False, indent=2))'
          done
          echo '===== CERTIFICAT TLS PRÉSENTÉ ====='
          echo | openssl s_client -connect parisauriol.com:443 -servername parisauriol.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true

      - name: Demander l’activation de HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo '===== TENTATIVE D’ACTIVATION ====='
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -F https_enforced=true 2>&1 | tee activation-response.txt
          activation_status=${PIPESTATUS[0]}
          echo "Code de sortie : ${activation_status}"
          sleep 3
          gh api "repos/${GITHUB_REPOSITORY}/pages" > pages-after.json
          python - <<'PY'
          import json
          data = json.load(open('pages-after.json', encoding='utf-8'))
          print(json.dumps({
              'custom_domain': data.get('cname'),
              'https_enforced': data.get('https_enforced'),
              'certificate_state': (data.get('https_certificate') or {}).get('state'),
              'certificate_description': (data.get('https_certificate') or {}).get('description'),
              'certificate_domains': (data.get('https_certificate') or {}).get('domains'),
          }, ensure_ascii=False, indent=2))
          PY
          exit 0
