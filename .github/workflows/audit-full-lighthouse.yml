name: Auditer toutes les catégories Lighthouse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-full-lighthouse.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lancer le site local
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Exécuter Lighthouse mobile et ordinateur
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome)
          audit() {
            port=$1
            preset=$2
            output=$3
            rm -rf "/tmp/chrome-${port}"
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --remote-debugging-address=127.0.0.1 --remote-debugging-port="$port" \
              --user-data-dir="/tmp/chrome-${port}" about:blank >/tmp/chrome-${port}.log 2>&1 &
            pid=$!
            for attempt in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:${port}/json/version" >/dev/null && break
              sleep 1
            done
            if [ "$preset" = "mobile" ]; then
              npx --yes lighthouse@13.4.1 http://127.0.0.1:8080/ \
                --form-factor=mobile --screen-emulation.mobile=true --port="$port" \
                --output=json --output-path="$output" --quiet
            else
              npx --yes lighthouse@13.4.1 http://127.0.0.1:8080/ \
                --preset=desktop --port="$port" --output=json --output-path="$output" --quiet
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          audit 9332 mobile lighthouse-full-mobile.json
          audit 9333 desktop lighthouse-full-desktop.json
          node <<'NODE'
          const fs = require('fs');
          const summary = {};
          for (const [file, label] of [['lighthouse-full-mobile.json','mobile'],['lighthouse-full-desktop.json','desktop']]) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = Object.fromEntries(Object.entries(r.categories).map(([id, c]) => [id, Math.round(c.score * 100)]));
            const metrics = {};
            for (const id of ['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','total-blocking-time','speed-index','interactive']) {
              const audit = r.audits[id];
              if (audit) metrics[id] = {numericValue: audit.numericValue, displayValue: audit.displayValue, score: audit.score};
            }
            const opportunities = Object.values(r.audits)
              .filter(a => a.details && a.details.type === 'opportunity' && a.numericValue > 0)
              .sort((a,b) => b.numericValue - a.numericValue)
              .slice(0,10)
              .map(a => ({id:a.id,title:a.title,displayValue:a.displayValue,numericValue:a.numericValue}));
            summary[label] = {categories, metrics, opportunities};
            console.log(label, JSON.stringify(summary[label], null, 2));
          }
          fs.writeFileSync('lighthouse-full-summary.json', JSON.stringify(summary, null, 2) + '\n');
          NODE
      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parisauriol-full-lighthouse
          path: lighthouse-full-*.json
          retention-days: 7
