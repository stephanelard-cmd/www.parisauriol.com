name: Publier officiellement Paris Auriol sur GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pages-official.yml"
      - "data/publish-pages-trigger.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l’artefact du site statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-https:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Vérifier le certificat personnalisé
        shell: bash
        run: |
          set +e
          valid=false
          for attempt in $(seq 1 18); do
            echo "Contrôle certificat ${attempt}/18"
            certificate=$(timeout 15 bash -c \
              'echo | openssl s_client -connect parisauriol.com:443 -servername parisauriol.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName' \
              2>/dev/null)
            echo "$certificate"
            if echo "$certificate" | grep -Eq 'DNS:parisauriol\.com([,[:space:]]|$)'; then
              valid=true
              break
            fi
            sleep 10
          done
          echo "Certificat parisauriol.com valide : ${valid}"
          test "$valid" = true
