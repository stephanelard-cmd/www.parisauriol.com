name: Vérifier la galerie et les langues en ligne

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-live-gallery.yml"
      - "data/verify-gallery-trigger.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-gallery.yml"
      - "data/verify-gallery-trigger.txt"

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Tester le site public dans Chromium
        run: |
          mkdir -p browser-report
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright, expect

          report = {}
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  locale='en-GB',
                  timezone_id='Europe/Paris',
                  viewport={'width': 1440, 'height': 1000},
                  ignore_https_errors=True,
              )
              page = context.new_page()

              page.goto('https://parisauriol.com/photos.html?lang=en', wait_until='domcontentloaded', timeout=90000)
              page.wait_for_selector('#language-select', timeout=30000)
              page.wait_for_function("document.querySelectorAll('[data-lightbox]').length === 8")
              page.wait_for_function("[...document.images].filter(i => i.closest('[data-lightbox]')).every(i => i.complete && i.naturalWidth > 0)", timeout=60000)
              assert page.locator('h1').inner_text().strip() == 'Apartment photos'
              assert page.locator('#language-select').input_value() == 'en'
              assert page.locator('[data-lightbox]').count() == 8
              assert page.locator('.placeholder-gallery').count() == 0
              dimensions = page.locator('[data-lightbox] img').evaluate_all("imgs => imgs.map(i => [i.naturalWidth, i.naturalHeight])")
              assert all(width > 0 and height > 0 for width, height in dimensions)

              # Vérifier aussi les variantes WebP réellement annoncées par les srcset.
              from urllib.parse import urljoin
              variant_paths = page.locator('picture source').evaluate_all(
                  "sources => sources.flatMap(source => source.srcset.split(',').map(candidate => candidate.trim().split(/\\s+/)[0]))"
              )
              assert len(variant_paths) == 24, f'Nombre inattendu de variantes WebP : {len(variant_paths)}'
              for variant_path in variant_paths:
                  response = page.request.get(urljoin('https://parisauriol.com', variant_path))
                  content_type = response.headers.get('content-type', '').lower()
                  assert response.ok, f'Variante image inaccessible : {variant_path} (HTTP {response.status})'
                  assert 'image/webp' in content_type, f'MIME incorrect pour {variant_path} : {content_type}'

              page.screenshot(path='browser-report/photos-en.png', full_page=True)

              page.locator('[data-lightbox]').first.click()
              page.wait_for_selector('dialog.photo-lightbox[open]')
              caption_en = page.locator('.photo-lightbox figcaption').inner_text()
              assert 'Bright living room with sofa and large window' in caption_en
              page.screenshot(path='browser-report/lightbox-en.png')
              page.locator('.lightbox-close').click()

              page.select_option('#language-select', 'de')
              page.wait_for_function("document.querySelector('h1').textContent.trim() === 'Fotos der Unterkunft'")
              assert page.locator('#language-select').input_value() == 'de'
              page.screenshot(path='browser-report/photos-de.png', full_page=True)

              hero_background = ''
              frame_background = ''
              for attempt in range(30):
                  page.goto(f'https://parisauriol.com/?lang=es&check={attempt}', wait_until='domcontentloaded', timeout=90000)
                  page.wait_for_selector('#language-select', timeout=30000)
                  try:
                      expect(page.locator('h1')).to_have_text(
                          'Apartamento vacacional en París 13 cerca de Austerlitz y Accor Arena',
                          timeout=30000,
                      )
                  except Exception:
                      print(json.dumps({
                          'spanish_home_url': page.url,
                          'spanish_home_heading': page.locator('h1').all_text_contents(),
                          'spanish_home_language': page.locator('html').get_attribute('lang'),
                      }, ensure_ascii=False))
                      page.screenshot(path='browser-report/home-es-failure.png', full_page=True)
                      raise
                  hero_background = page.locator('.hero').evaluate("el => getComputedStyle(el).backgroundImage")
                  frame_background = page.locator('.photo-frame').evaluate("el => getComputedStyle(el).backgroundImage")
                  if (
                      '/assets/photos/salon-fenetre.jpg' in hero_background
                      and '/assets/photos/cuisine-equipee.jpg' in frame_background
                      and '/assets/assets/' not in hero_background
                      and '/assets/assets/' not in frame_background
                  ):
                      break
                  page.wait_for_timeout(3000)
              else:
                  raise AssertionError(
                      f'Chemins des photos d’accueil incorrects : hero={hero_background}, frame={frame_background}'
                  )

              hero_response = page.request.get('https://parisauriol.com/assets/photos/salon-fenetre.jpg')
              frame_response = page.request.get('https://parisauriol.com/assets/photos/cuisine-equipee.jpg')
              assert hero_response.ok
              assert frame_response.ok
              # Figer les preuves espagnoles avant toute navigation vers le calendrier.
              spanish_home = {
                  'heading': page.locator('h1').inner_text().strip(),
                  'url': page.url,
                  'language': page.locator('html').get_attribute('lang'),
                  'selected_language': page.locator('#language-select').input_value(),
              }
              assert spanish_home['selected_language'] == 'es', spanish_home
              assert spanish_home['language'] == 'es', spanish_home
              assert urlsplit(spanish_home['url']).path == '/es/', spanish_home
              page.screenshot(path='browser-report/home-es.png', full_page=True)

              # Vérifier que le calendrier réellement affiché récupère bien le flux JSON public.
              with page.expect_response(
                  lambda response: urlsplit(response.url).path == '/data/calendar.json',
                  timeout=90000,
              ) as calendar_download:
                  page.goto(
                      'https://parisauriol.com/disponibilites.html?lang=fr&check=calendar',
                      wait_until='domcontentloaded',
                      timeout=90000,
                  )
              # Comparer au flux consommé par la page, sans seconde requête concurrente.
              calendar_response = calendar_download.value
              assert calendar_response.ok, (
                  f'Flux calendrier inaccessible : HTTP {calendar_response.status}'
              )
              calendar_payload = calendar_response.json()
              assert calendar_payload.get('status') == 'active', calendar_payload
              assert calendar_payload.get('sources', {}).get('airbnb', 0) > 0
              assert calendar_payload.get('sources', {}).get('booking', 0) > 0
              page.wait_for_selector('#calendar-status', timeout=30000)
              page.wait_for_function(
                  "document.querySelectorAll('#calendar .calendar-month').length === 3",
                  timeout=30000,
              )
              calendar_status = page.locator('#calendar-status').inner_text()
              assert 'Synchronisation Airbnb + Booking active.' in calendar_status, (
                  f'Statut de synchronisation inattendu : {calendar_status}'
              )
              calendar_window = page.locator('#calendar .calendar-month').evaluate_all("""
                  months => {
                      const today = new Date();
                      const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                      return {
                          start: iso(today),
                          end: iso(new Date(today.getFullYear(), today.getMonth() + 3, 1)),
                          busy_dates: months.flatMap((month, offset) =>
                              [...month.querySelectorAll('.day.busy')].map(day => iso(new Date(
                                  today.getFullYear(), today.getMonth() + offset,
                                  Number(day.querySelector('b').textContent),
                              )))
                          ).sort(),
                      };
                  }
              """)
              # Même fenêtre que renderCalendar : aujourd’hui inclus, 4e mois exclu.
              # Les départs sont exclusifs ; une date couverte plusieurs fois ne compte qu’une fois.
              cursor = date.fromisoformat(calendar_window['start'])
              window_end = date.fromisoformat(calendar_window['end'])
              expected_busy_dates = []
              while cursor < window_end:
                  iso = cursor.isoformat()
                  if any(period['start'] <= iso < period['end'] for period in calendar_payload.get('busy', [])):
                      expected_busy_dates.append(iso)
                  cursor += timedelta(days=1)
              assert calendar_window['busy_dates'] == expected_busy_dates, (
                  f"Jours occupés incohérents : attendus={expected_busy_dates}, "
                  f"affichés={calendar_window['busy_dates']}"
              )
              busy_days = len(calendar_window['busy_dates'])
              calendar_months = page.locator('#calendar .calendar-month').count()
              page.screenshot(path='browser-report/availability-calendar.png', full_page=True)

              report = {
                  'photos_loaded': len(dimensions),
                  'webp_variants_checked': len(variant_paths),
                  'dimensions': dimensions,
                  'english_lightbox_caption': caption_en,
                  'german_heading': 'Fotos der Unterkunft',
                  'spanish_home_heading': spanish_home['heading'],
                  'spanish_home_url': spanish_home['url'],
                  'spanish_home_language': spanish_home['language'],
                  'spanish_home_selected_language': spanish_home['selected_language'],
                  'hero_background': hero_background,
                  'frame_background': frame_background,
                  'calendar_status': calendar_status,
                  'calendar_updated_at': calendar_payload.get('updated_at'),
                  'calendar_periods': len(calendar_payload.get('busy', [])),
                  'calendar_busy_days_visible': busy_days,
                  'calendar_busy_days_expected': len(expected_busy_dates),
                  'calendar_window_start': calendar_window['start'],
                  'calendar_window_end_exclusive': calendar_window['end'],
                  'calendar_months_visible': calendar_months,
                  'status': 'success',
              }
              browser.close()

          Path('browser-report/report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Conserver les captures de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parisauriol-gallery-language-check
          path: browser-report
          if-no-files-found: warn
          retention-days: 7
